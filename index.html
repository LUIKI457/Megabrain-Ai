<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<meta name="description" content="MegaBrain AI">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>MegaBrain AI</title>
<style>
:root{color-scheme:dark;--bg:#050b14;--panel:#0c1927;--line:#203b50;--cyan:#67e7ff;--text:#eaf8ff;--muted:#8ba8bc}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}
#eyes-screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,#102d43 0,#071421 38%,#050b14 75%);overflow:hidden}
#robot{display:flex;align-items:center;justify-content:center;gap:clamp(22px,7vw,52px);animation:float 4s ease-in-out infinite;cursor:pointer;padding:30px}
.eye{width:clamp(66px,19vw,116px);height:clamp(88px,25vw,145px);display:block;position:relative;border-radius:48% 48% 44% 44%;background:radial-gradient(ellipse at 50% 48%,#03121f 0 13%,#d5fcff 15% 20%,#5ce5ff 27%,#22a9e8 55%,#0c527b 82%,#062238 100%);box-shadow:0 0 22px #4adfff99,0 0 70px #20bfff44;animation:blink 5.2s infinite}
.eye:after{content:"";position:absolute;width:29%;height:30%;border-radius:50%;background:#04121e;left:calc(50% + var(--look-x,0px));top:calc(50% + var(--look-y,0px));transform:translate(-50%,-50%);box-shadow:inset 0 0 5px #000}
.eye:before{content:"";position:absolute;width:13%;height:13%;border-radius:50%;background:white;left:36%;top:23%;z-index:1;box-shadow:0 0 10px white}
#robot.listening .eye{height:clamp(78px,22vw,130px);box-shadow:0 0 32px #48e5ff,0 0 85px #20bfff66}
#robot.thinking .eye{animation:think .65s infinite alternate}
#robot.sleep .eye{height:5px;border-radius:50%;box-shadow:0 0 14px #4adfff77}
#robot.sleep .eye:before,#robot.sleep .eye:after{display:none}
#robot.happy .eye{height:clamp(48px,14vw,86px);border-radius:50% 50% 46% 46%;animation:happy .55s ease-in-out 2 alternate}
#robot.happy .eye:last-child{transform:rotate(7deg)}
#robot.excited{animation:bounce .48s ease-in-out 2}
#robot.excited .eye{height:clamp(96px,28vw,160px);animation:glow .65s ease-in-out infinite alternate}
#robot.curious .eye:first-child{transform:rotate(-9deg) scaleY(.88)}
#robot.curious .eye:last-child{transform:rotate(9deg) scaleY(1.08)}
#robot.oops .eye{animation:shake .35s ease-in-out 2}
@keyframes float{50%{transform:translateY(-7px)}}@keyframes blink{0%,44%,47%,100%{transform:scaleY(1)}45%,46%{transform:scaleY(.06)}}@keyframes think{to{transform:translateY(6px) scaleY(.92)}}@keyframes happy{to{transform:translateY(-4px) scaleY(.82)}}@keyframes bounce{45%{transform:translateY(-13px) scale(1.06)}}@keyframes glow{to{box-shadow:0 0 35px #4adfff,0 0 90px #20bfff88}}@keyframes shake{25%{transform:translateX(-5px) rotate(-5deg)}75%{transform:translateX(5px) rotate(5deg)}}
#chat-screen{display:none;min-height:100dvh;width:min(100%,760px);margin:auto;padding:14px 14px calc(16px + env(safe-area-inset-bottom));flex-direction:column;gap:12px}
body.chat-mode #eyes-screen{display:none}body.chat-mode #chat-screen{display:flex}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}.brand{font-size:14px;font-weight:800;letter-spacing:1.5px}.brand small{display:block;font-size:9px;font-weight:500;color:var(--muted);letter-spacing:1px}.top-actions{display:flex;gap:7px}.icon-btn,.tools button{border:1px solid var(--line);background:#102337;border-radius:12px;padding:10px 12px;color:#bceeff}
.status{font-size:10px;color:#65e6ad;display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#65e6ad}
.mini-eyes{height:82px;display:grid;place-items:center;background:radial-gradient(ellipse,#102d43,transparent 70%);border-radius:18px}.mini-eyes #robot{gap:13px;padding:8px}.mini-eyes .eye{width:30px;height:42px;box-shadow:0 0 10px #4adfff88}
.chat{flex:1;min-height:260px;border:1px solid var(--line);background:#0b1927;border-radius:21px;padding:13px;display:flex;flex-direction:column}.chat-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;margin-bottom:10px}.chat-head small{color:var(--muted);font-size:9px}.messages{flex:1;min-height:150px;max-height:48dvh;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:2px 0 12px}.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:12px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}.msg.bot{align-self:flex-start;background:#142b3e;border:1px solid #24465d;border-bottom-left-radius:4px}.msg.user{align-self:flex-end;background:#16435d;border:1px solid #286d8d;border-bottom-right-radius:4px}.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:11px}.composer input{flex:1;min-width:0;background:#07131f;border:1px solid #29465a;border-radius:13px;padding:12px;color:var(--text);outline:none}.send{width:46px;border:0;border-radius:13px;background:linear-gradient(145deg,#279fd1,#17699d);font-size:19px}.mic{width:100%;border:1px solid #286b89;background:linear-gradient(110deg,#17638a,#1684a5);border-radius:16px;padding:15px;font-size:12px;font-weight:800;letter-spacing:1px}.mic.active{background:linear-gradient(110deg,#a82c50,#e35b76)}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{flex:1;font-size:10px}.foot{text-align:center;color:#58768c;font-size:9px;letter-spacing:1px}
body.light{color-scheme:light;--bg:#eaf4fa;--line:#c4dce8;--text:#102a3c;background:#eaf4fa}body.light #chat-screen{background:#eaf4fa}body.light .chat{background:#f7fcff}body.light .composer input{background:white;color:#102a3c}body.light .msg.bot{background:#e5f2f8;color:#17394f}body.light .msg.user{background:#ccecff;color:#15394e}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<section id="eyes-screen" aria-label="Tela dos olhos do MegaBrain"><div id="robot" aria-label="Dois olhos animados"><i class="eye"></i><i class="eye"></i></div></section>
<main id="chat-screen">
<header><div class="brand">MEGABRAIN AI<small> MODO DE CONVERSA</small></div><div class="top-actions"><div class="status"><i class="dot"></i><span id="status">LOCAL</span></div><button class="icon-btn" id="back-eyes">◉ OLHOS</button><button class="icon-btn" id="full" title="Tela cheia">⛶</button></div></header>
<div class="mini-eyes"><div id="robot-mini" aria-hidden="true"><i class="eye"></i><i class="eye"></i></div></div>
<section class="chat"><div class="chat-head"><strong>CONVERSA</strong><small id="memory-status">MEMÓRIA LOCAL ATIVA</small></div><div class="messages" id="messages" aria-live="polite"></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Escreva uma mensagem..." aria-label="Mensagem"><button class="send" aria-label="Enviar">➤</button></form></section>
<button class="mic" id="mic">🎙 TOCAR PARA FALAR</button>
<div class="tools"><button id="ai-config">⚙ IA ONLINE</button><button id="export">⇩ EXPORTAR</button><button id="clear">⌫ LIMPAR</button><button id="theme">◐ TEMA</button></div>
<div class="foot">MEGABRAIN AI • EYES-ONLY • LOCAL-FIRST</div>
</main>
<script src="./app.js" defer></script>
</body></html>
