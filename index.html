<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<meta name="description" content="MegaBrain AI">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>MegaBrain AI</title>
<style>
:root{color-scheme:dark;--bg:#07111c;--panel:#101f2e;--line:#294357;--cyan:#75e6ef;--text:#effaff;--muted:#91a9b9}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}
#eyes-screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,#17394a 0,#0b1d2b 43%,#07111c 78%);overflow:hidden}
#robot{display:flex;align-items:center;justify-content:center;gap:clamp(22px,7vw,54px);animation:float 5s ease-in-out infinite;cursor:pointer;padding:30px;-webkit-tap-highlight-color:transparent}
.eye{width:clamp(76px,20vw,124px);height:clamp(100px,27vw,154px);display:block;position:relative;border-radius:48% 48% 46% 46%;background:linear-gradient(145deg,#fff 0%,#eaf7fa 72%,#cce5ec 100%);box-shadow:0 8px 24px #0003,0 0 28px #75e6ef25;animation:blink 6s infinite;transition:height .22s ease,border-radius .22s ease,transform .22s ease}
.eye:before{content:"";position:absolute;width:58%;height:58%;border-radius:50%;left:50%;top:51%;transform:translate(calc(-50% + var(--look-x,0px)),calc(-50% + var(--look-y,0px)));background:radial-gradient(circle at 35% 28%,#b9faff 0 5%,#56d5e7 18%,#168bb4 56%,#075074 100%);box-shadow:0 2px 7px #07415c88}
.eye:after{content:"";position:absolute;width:29%;height:34%;border-radius:50%;left:50%;top:51%;transform:translate(calc(-50% + var(--look-x,0px)),calc(-50% + var(--look-y,0px)));background:#061b2b;box-shadow:5px -7px 0 -3px #fff,0 1px 3px #0008}
#robot.listening .eye{height:clamp(112px,30vw,166px);box-shadow:0 8px 24px #0003,0 0 35px #75e6ef66}
#robot.thinking .eye{animation:think .8s ease-in-out infinite alternate}
#robot.sleep .eye{height:7px;border-radius:50%;box-shadow:0 0 18px #75e6ef55}
#robot.sleep .eye:before,#robot.sleep .eye:after{display:none}
#robot.happy .eye{height:clamp(55px,15vw,88px);border-radius:50% 50% 44% 44%;animation:happy .6s ease-in-out 2 alternate}
#robot.happy .eye:last-child{transform:rotate(5deg)}
#robot.excited{animation:bounce .5s ease-in-out 2}
#robot.excited .eye{height:clamp(112px,30vw,166px);animation:glow .7s ease-in-out infinite alternate}
#robot.curious .eye:first-child{transform:rotate(-7deg) scaleY(.9)}
#robot.curious .eye:last-child{transform:rotate(7deg) scaleY(1.06)}
#robot.oops .eye{animation:shake .35s ease-in-out 2}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes blink{0%,43%,46%,100%{transform:scaleY(1)}44%,45%{transform:scaleY(.07)}}@keyframes think{to{transform:translateY(5px) scaleY(.94)}}@keyframes happy{to{transform:translateY(-3px) scaleY(.8)}}@keyframes bounce{45%{transform:translateY(-12px) scale(1.04)}}@keyframes glow{to{box-shadow:0 8px 24px #0003,0 0 42px #75e6ef88}}@keyframes shake{25%{transform:translateX(-4px) rotate(-4deg)}75%{transform:translateX(4px) rotate(4deg)}}
#chat-screen{display:none;min-height:100dvh;width:min(100%,760px);margin:auto;padding:14px 14px calc(16px + env(safe-area-inset-bottom));flex-direction:column;gap:12px}
body.chat-mode #eyes-screen{display:none}body.chat-mode #chat-screen{display:flex}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}.brand{font-size:14px;font-weight:800;letter-spacing:1.5px}.brand small{display:block;font-size:9px;font-weight:500;color:var(--muted);letter-spacing:1px}.top-actions{display:flex;gap:7px}.icon-btn,.tools button{border:1px solid var(--line);background:#13283a;border-radius:12px;padding:10px 12px;color:#c8f4fb}
.status{font-size:10px;color:#65e6ad;display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:#65e6ad}
.mini-eyes{height:74px;display:grid;place-items:center;background:radial-gradient(ellipse,#17394a,transparent 70%);border-radius:18px}.mini-eyes #robot-mini{display:flex;align-items:center;gap:13px;padding:8px}.mini-eyes .eye{width:30px;height:39px;box-shadow:0 3px 8px #0002}
.chat{flex:1;min-height:260px;border:1px solid var(--line);background:#0d1d2b;border-radius:21px;padding:13px;display:flex;flex-direction:column;box-shadow:0 12px 32px #0002}.chat-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;margin-bottom:10px}.chat-head small{color:var(--muted);font-size:9px}.messages{flex:1;min-height:150px;max-height:48dvh;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:2px 0 12px}.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:12px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}.msg.bot{align-self:flex-start;background:#172e40;border:1px solid #29495d;border-bottom-left-radius:4px}.msg.user{align-self:flex-end;background:#15516a;border:1px solid #26728d;border-bottom-right-radius:4px}.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:11px}.composer input{flex:1;min-width:0;background:#081522;border:1px solid #304b5d;border-radius:13px;padding:12px;color:var(--text);outline:none}.composer input:focus{border-color:#69dce9;box-shadow:0 0 0 3px #69dce922}.send{width:46px;border:0;border-radius:13px;background:linear-gradient(145deg,#35b6c8,#167b9f);font-size:19px}.mic{width:100%;border:1px solid #286b89;background:linear-gradient(110deg,#176b87,#16859b);border-radius:16px;padding:15px;font-size:12px;font-weight:800;letter-spacing:1px}.mic.active{background:linear-gradient(110deg,#a82c50,#e35b76)}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{flex:1;font-size:10px}.foot{text-align:center;color:#6c899b;font-size:9px;letter-spacing:1px}
body.light{color-scheme:light;--bg:#eaf4f8;--line:#c4dce5;--text:#102a3c;background:#eaf4f8}body.light #chat-screen{background:#eaf4f8}body.light .chat{background:#f7fcff}body.light .composer input{background:white;color:#102a3c}body.light .msg.bot{background:#e5f2f8;color:#17394f}body.light .msg.user{background:#ccecff;color:#15394e}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<section id="eyes-screen" aria-label="Tela dos olhos do MegaBrain"><div id="robot" aria-label="Dois olhos animados"><i class="eye"></i><i class="eye"></i></div></section>
<main id="chat-screen">
<header><div class="brand">MEGABRAIN AI<small> MODO DE CONVERSA</small></div><div class="top-actions"><div class="status"><i class="dot"></i><span id="status">LOCAL</span></div><button class="icon-btn" id="back-eyes">◉ OLHOS</button><button class="icon-btn" id="full" title="Tela cheia">⛶</button></div></header>
<div class="mini-eyes"><div id="robot-mini" aria-hidden="true"><i class="eye"></i><i class="eye"></i></div></div>
<section class="chat"><div class="chat-head"><strong>CONVERSA</strong><small id="memory-status">MEMÓRIA LOCAL ATIVA</small></div><div class="messages" id="messages" aria-live="polite"></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Escreva uma mensagem..." aria-label="Mensagem"><button class="send" aria-label="Enviar">➤</button></form></section>
<button class="mic" id="mic">🎙 TOCAR PARA FALAR</button>
<div class="tools"><button id="ai-config">⚙ IA ONLINE</button><button id="export">⇩ EXPORTAR</button><button id="clear">⌫ LIMPAR</button><button id="theme">◐ TEMA</button></div>
<div class="foot">MEGABRAIN AI • EYES-ONLY • LOCAL-FIRST</div>
</main>
<script src="./app.js" defer></script>
</body></html>
